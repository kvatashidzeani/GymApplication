# Shared defaults for all environments.
# Activate a profile with: --spring.profiles.active=local|dev|stg|prod
# or SPRING_PROFILES_ACTIVE / IntelliJ Active profiles.
spring.application.name=gym-crm
spring.profiles.active=local

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Return 404 through RestExceptionHandler for unknown paths
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# In-memory seed data
data.storage=classpath:initial-data.json

# JPA defaults (overridable per profile)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator / Micrometer defaults (overridable per profile)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

info.app.name=Gym CRM
info.app.description=Gym CRM REST API
info.app.version=1.0-SNAPSHOT

# JWT (HMAC secret must be at least 256 bits for HS256)
gymcrm.jwt.secret=${JWT_SECRET:GymCrmJwtSecretKey-ChangeMe-AtLeast32CharsLong!}
gymcrm.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS (used by Spring Security http.cors())
gymcrm.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
gymcrm.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
gymcrm.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
gymcrm.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization}
gymcrm.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
gymcrm.cors.max-age=${CORS_MAX_AGE:3600}

# Trainer workload microservice (asynchronous via ActiveMQ)
gymcrm.workload.enabled=${WORKLOAD_ENABLED:true}
gymcrm.workload.messaging.enabled=${WORKLOAD_MESSAGING_ENABLED:true}
gymcrm.workload.queue=${WORKLOAD_QUEUE:workload.events.queue}

# ActiveMQ broker (run Apache ActiveMQ on tcp://localhost:61616)
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.activemq.packages.trust-all=true

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Circuit breaker (Resilience4j) for trainer-workload-service
resilience4j.circuitbreaker.instances.workloadService.sliding-window-size=10
resilience4j.circuitbreaker.instances.workloadService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.workloadService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.workloadService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.workloadService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.workloadService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.workloadService.timeout-duration=3s

management.health.circuitbreakers.enabled=true
management.endpoint.health.group.circuitbreakers.include=circuitBreakers

