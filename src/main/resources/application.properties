# PostgreSQL (chosen DBMS for Hibernate)
spring.datasource.url=jdbc:postgresql://localhost:5432/gymapplication
spring.datasource.username=postgres
spring.datasource.password=bazebi-17
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA — validate against existing PostgreSQL schema (do not auto-alter tables)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

data.storage=classpath:initial-data.json
