# Production environment
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Minimal exposure in production
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

logging.level.root=WARN
logging.level.com.gymcrm=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# Restrict browser origins in production (override via CORS_ALLOWED_ORIGIN_PATTERNS)
gymcrm.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.example.com}
