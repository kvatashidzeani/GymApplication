# Docker with integrations: Postgres + ActiveMQ + Eureka (shared gym-net)
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/gymapplication}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

gymcrm.workload.enabled=${WORKLOAD_ENABLED:true}
gymcrm.workload.messaging.enabled=${WORKLOAD_MESSAGING_ENABLED:true}

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://activemq:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gym-crm

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
