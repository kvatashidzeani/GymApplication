# Console demo: no Eureka / no ActiveMQ workload publishing
gymcrm.workload.enabled=false
gymcrm.workload.messaging.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
