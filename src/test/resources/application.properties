spring.datasource.url=jdbc:h2:mem:gymcrm-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

data.storage=classpath:initial-data.json

gymcrm.jwt.secret=GymCrmJwtSecretKey-ChangeMe-AtLeast32CharsLong!
gymcrm.jwt.expiration-ms=3600000

gymcrm.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
gymcrm.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
gymcrm.cors.allowed-headers=*
gymcrm.cors.exposed-headers=Authorization
gymcrm.cors.allow-credentials=true
gymcrm.cors.max-age=3600

# Unit/integration tests do not require Eureka / ActiveMQ / secondary microservice
gymcrm.workload.enabled=false
gymcrm.workload.messaging.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
