spring.datasource.url=jdbc:h2:mem:gymcrm-integration;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

data.storage=classpath:initial-data.json

gymcrm.jwt.secret=GymCrmJwtSecretKey-ChangeMe-AtLeast32CharsLong!
gymcrm.jwt.expiration-ms=3600000

gymcrm.workload.enabled=true
gymcrm.workload.messaging.enabled=true
gymcrm.workload.queue=workload.events.queue
gymcrm.workload.dlq=workload.events.dlq

spring.activemq.packages.trust-all=true
spring.activemq.in-memory=true

resilience4j.circuitbreaker.instances.workloadService.sliding-window-size=100
resilience4j.circuitbreaker.instances.workloadService.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.workloadService.failure-rate-threshold=100
resilience4j.timelimiter.instances.workloadService.timeout-duration=30s

spring.data.mongodb.database=gym_workload_integration
spring.data.mongodb.auto-index-creation=true
de.flapdoodle.mongodb.embedded.version=7.0.0

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration

management.health.mongo.enabled=false
management.health.jms.enabled=false
management.health.diskspace.enabled=false
