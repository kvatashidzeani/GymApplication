# Docker with integrations: MongoDB + ActiveMQ + Eureka (shared gym-net)
server.port=8082

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=trainer-workload-service

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://activemq:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://mongo:27017/gym_workload}
spring.data.mongodb.database=${MONGODB_DATABASE:gym_workload}
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
