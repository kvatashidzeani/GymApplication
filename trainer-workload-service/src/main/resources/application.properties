server.port=8082
spring.application.name=trainer-workload-service

# Must match Gym CRM gymcrm.jwt.secret (shared HS256 key for microservice JWT)
gymcrm.jwt.secret=${JWT_SECRET:GymCrmJwtSecretKey-ChangeMe-AtLeast32CharsLong!}

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.gymcrm.workload=INFO
logging.level.com.gymcrm.workload.security=DEBUG
