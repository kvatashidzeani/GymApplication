server.port=8082
spring.application.name=trainer-workload-service

# Must match Gym CRM gymcrm.jwt.secret (shared HS256 key for microservice JWT)
gymcrm.jwt.secret=${JWT_SECRET:GymCrmJwtSecretKey-ChangeMe-AtLeast32CharsLong!}

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.gymcrm.workload=INFO
logging.level.com.gymcrm.workload.security=DEBUG

# ActiveMQ consumer for workload events from Gym CRM
gymcrm.workload.queue=${WORKLOAD_QUEUE:workload.events.queue}
gymcrm.workload.dlq=${WORKLOAD_DLQ:workload.events.dlq}
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.activemq.packages.trust-all=true

# MongoDB — trainer training summary (nested years → months → duration)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gym_workload}
spring.data.mongodb.database=${MONGODB_DATABASE:gym_workload}
spring.data.mongodb.auto-index-creation=true
